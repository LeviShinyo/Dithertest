<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Dither Bench II</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jacquard+12&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=JetBrains+Mono:wght@500&family=VT323&family=Space+Mono:wght@700&family=Courier+Prime:wght@700&family=Silkscreen&family=Press+Start+2P&family=UnifrakturCook:wght@700&family=Pirata+One&display=swap">
<style>
/* Layout: print-shop bench. Proof fills the left; one scrolling column of collapsible drawers on the right, stacked proof-first on phones.
   Single dark theme on purpose: a neutral dark surround is what you proof ink against. */
:root{
  color-scheme:dark;
  --bg:#111210; --panel:#191a17; --field:#0c0d0b; --raise:#22231f; --line:#2f312b; --line-2:#4a4d44;
  --fg:#e7e2d3; --muted:#8f9184; --accent:#dba63f; --accent-ink:#17150d; --stage:#060605; --warn:#e2694a;
  --wordmark:"Jacquard 12","Pirata One",serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:13px;line-height:1.4;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column}
.app{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:14px}
.viewport{display:flex;flex-direction:column;gap:10px;min-width:0;min-height:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow-y:auto;min-height:0;display:flex;flex-direction:column}
@media (max-width:900px){html,body{height:auto}.app{display:flex;flex-direction:column}.stage{height:56vh;flex:none!important}.panel{overflow:visible}}

.head{padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.brand canvas{width:26px;height:26px;image-rendering:pixelated;flex:none}
.brand h1{font-family:var(--wordmark);font-weight:400;font-size:2.15rem;line-height:.9;margin:0;letter-spacing:.01em}
.brand h1 span{color:var(--accent)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.src{font-family:var(--mono);font-size:.7rem;color:var(--muted);margin:0;overflow-wrap:anywhere}
.src .tag{color:var(--accent);margin-right:6px;text-transform:uppercase;letter-spacing:.08em}

button,select,input,textarea{font:inherit;color:var(--fg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--raise);border:1px solid var(--line-2);border-radius:5px;padding:8px 10px;font-size:.82rem;font-weight:500;cursor:pointer;position:relative}
.btn:hover{border-color:var(--fg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.small{padding:4px 9px;font-size:.76rem}
.btn:disabled{opacity:.4;cursor:default}
.btn input[type=file]{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select,input[type=number],input[type=text],textarea{background:var(--field);border:1px solid var(--line);border-radius:4px;padding:5px 7px;min-width:0}
select{width:100%}
input[type=text]{width:100%}
input[type=number]{width:58px;flex:none;font-family:var(--mono);font-size:.76rem;font-variant-numeric:tabular-nums;text-align:right;-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button{display:none}
input[type=color]{width:34px;height:26px;flex:none;border:1px solid var(--line-2);border-radius:4px;padding:1px;background:var(--field);cursor:pointer}
/* sliders: amber fill up to the value (--p is set from script), 24px-tall grab area, 16px thumb */
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:24px;background:transparent;cursor:pointer;margin:0;--p:0%}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:linear-gradient(90deg,var(--accent) var(--p),var(--line-2) var(--p))}
input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:var(--line-2)}
input[type=range]::-moz-range-progress{height:3px;border-radius:2px;background:var(--accent)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-6.5px;border-radius:50%;background:var(--fg);border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line-2)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--fg);border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line-2)}
input[type=range]:hover::-webkit-slider-thumb,input[type=range]:active::-webkit-slider-thumb{background:var(--accent)}
input[type=range]:hover::-moz-range-thumb,input[type=range]:active::-moz-range-thumb{background:var(--accent)}

/* drawers */
details.sec{border-bottom:1px solid var(--line)}
details.sec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:11px 14px;font-size:.72rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--fg);user-select:none;background:#1d1e1a;box-shadow:inset 2px 0 0 transparent}
details.sec>summary:hover{background:#21221e}
details.sec[open]>summary{box-shadow:inset 2px 0 0 var(--accent);border-bottom:1px solid var(--line);margin-bottom:10px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"";width:6px;height:6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(-45deg);transition:transform .12s}
details.sec[open]>summary::before{transform:rotate(45deg)}
details.sec>summary .sum{margin-left:auto;font-family:var(--mono);font-weight:400;font-size:.68rem;letter-spacing:0;text-transform:none;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%}
.body{display:flex;flex-direction:column;gap:7px;padding:0 14px 14px}
.r{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 8px;align-items:center;min-height:28px;position:relative}
.k{color:var(--muted);font-size:.8rem;line-height:1.15}
.kw{min-width:0;line-height:1.15}
.kw .help{vertical-align:-3px;margin-left:5px}
.r.mod .k{color:var(--fg)}
/* changed-from-the-Look marker: an amber dot in the gutter; it is also the reset button for that row */
.modb{position:absolute;left:-12px;top:14px;transform:translateY(-50%);width:9px;height:9px;padding:0;border:0;border-radius:50%;background:var(--accent);cursor:pointer;display:none}
.modb::after{content:"";position:absolute;inset:-7px}
.modb:hover{box-shadow:0 0 0 3px rgba(219,166,63,.3)}
.r.mod>.modb{display:block}
.help{flex:none;width:16px;height:16px;padding:0;border:1px solid var(--line-2);border-radius:50%;background:transparent;color:var(--muted);font:600 .62rem/1 var(--mono);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;position:relative}
.help::after{content:"";position:absolute;inset:-6px}
.help:hover,.help[aria-expanded="true"]{border-color:var(--accent);color:var(--accent)}
.tipt{grid-column:1/-1;margin:0 0 4px;padding:6px 8px;border-left:2px solid var(--accent);background:var(--field);border-radius:0 4px 4px 0;font-size:.74rem;color:var(--fg);line-height:1.4}
.v{display:flex;align-items:center;gap:8px;min-width:0}
.sub{font-size:.68rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.note{font-size:.74rem;color:var(--muted);margin:0;font-family:var(--mono)}
.note.warn{color:var(--warn)}
.seg{display:flex;border:1px solid var(--line-2);border-radius:5px;overflow:hidden;flex:1;min-width:0}
.seg button{flex:1;border:0;background:transparent;padding:6px 6px;font-size:.78rem;cursor:pointer;color:var(--muted);white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);font-weight:600}
.seg.big button{padding:8px 6px;font-size:.84rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--raise);border:1px solid var(--line);border-radius:4px;padding:4px 8px;cursor:pointer;font-size:.78rem}
.chip:hover{border-color:var(--accent)}
.dots{display:inline-flex}
.dots i{width:9px;height:12px;border:1px solid rgba(255,255,255,.18);margin-left:-1px}
.dots i:first-child{margin-left:0}
.scrollbox{max-height:142px;overflow:auto;border:1px solid var(--line);border-radius:5px;padding:7px;background:var(--field)}

/* levels */
.levels{display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);border-radius:5px;background:var(--field);padding:6px 0 8px}
#hist{height:40px;width:calc(100% - 16px);margin:0 8px;display:block}
.ramp{height:4px;margin:0 8px;background:linear-gradient(90deg,#000,#fff)}
.ltrack{position:relative;height:16px;margin:0 8px}
.lh{position:absolute;top:1px;width:13px;height:13px;transform:translateX(-50%);border-radius:50%;border:0;background:var(--fg);padding:0;cursor:ew-resize;touch-action:none}
.lh.mid{background:var(--muted)}
.lnums{display:flex;justify-content:space-between;padding:0 6px}

/* inks */
.ink{display:grid;grid-template-columns:34px minmax(0,1fr) 58px 24px;gap:8px;align-items:center}
.x{width:24px;height:24px;border:1px solid var(--line);background:transparent;border-radius:4px;color:var(--muted);cursor:pointer;padding:0;line-height:1}
.x:hover{color:var(--warn);border-color:var(--warn)}
.swatches{display:flex;flex-wrap:wrap;gap:5px}
.tilebox{display:flex;gap:10px;align-items:center}
#tilePreview{width:40px;height:40px;image-rendering:pixelated;border:1px solid var(--line);flex:none}
.saverow{display:flex;gap:6px}
.saved{display:flex;flex-direction:column;gap:6px}
.saved .item{display:flex;gap:6px;align-items:center}
.saved .item .chip{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
pre#recipe{font-family:var(--mono);font-size:.68rem;background:var(--field);border:1px solid var(--line);border-radius:4px;padding:8px;margin:0;max-height:160px;overflow:auto;white-space:pre}
textarea{width:100%;min-height:60px;font-family:var(--mono);font-size:.7rem;resize:vertical}
.savebtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* viewport */
.vbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.vbar .grp{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.vbar .seg{flex:none}
.vbar .seg button{padding:5px 10px}
.stat{font-family:var(--mono);font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tb{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line-2);background:transparent;border-radius:5px;padding:5px 10px;font-size:.78rem;cursor:pointer;color:var(--fg)}
.tb:hover:not(:disabled){border-color:var(--fg)}
.tb:disabled{opacity:.35;cursor:default}
.tb[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.stage{flex:1;min-height:240px;display:flex;overflow:auto;background:var(--stage);border:1px solid var(--line);border-radius:8px;padding:16px}
.stage.checker{background-color:#1a1b18;background-image:linear-gradient(45deg,#272823 25%,transparent 25%,transparent 75%,#272823 75%),linear-gradient(45deg,#272823 25%,transparent 25%,transparent 75%,#272823 75%);background-size:16px 16px;background-position:0 0,8px 8px}
.stage canvas{margin:auto;display:block;image-rendering:pixelated;image-rendering:crisp-edges;flex:none}
.stage.fit canvas{width:100%;height:100%;object-fit:contain;flex:1}
.stage.busy canvas{opacity:.6}
.busy-label{color:var(--accent)}
.plates{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;align-content:start}
.plate{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.plate canvas{width:100%;height:auto;image-rendering:pixelated;background:#fff;display:block}
.plate .meta{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:.7rem;color:var(--muted)}
.plate .meta b{display:inline-flex;gap:6px;align-items:center;color:var(--fg);font-weight:500}
.plate .meta b i{width:11px;height:11px;border:1px solid rgba(255,255,255,.3)}
.plate .btn{align-self:flex-start}
.exports{display:flex;flex-direction:column;gap:8px;max-height:260px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.exports .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.exports figure{margin:0;display:flex;flex-direction:column;gap:5px;min-width:0}
.exports img{width:100%;height:auto;image-rendering:pixelated;background:#1a1b18}
.exports figcaption{font-family:var(--mono);font-size:.66rem;color:var(--muted);overflow-wrap:anywhere}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);font-size:.8rem;padding:8px 14px;border-radius:5px;z-index:10;max-width:calc(100% - 32px)}
.toast.warn{background:var(--warn)}
/* desktop: the panel header and each open drawer's title stay pinned while the panel scrolls */
@media (min-width:901px){
  .head{position:sticky;top:0;z-index:3;background:var(--panel)}
  details.sec>summary{position:sticky;top:var(--headH,0px);z-index:2}
}
/* phone: the proof stays pinned above the controls; toolbar packs into two rows with Undo/Redo/Reset first */
@media (max-width:900px){
  .viewport{position:sticky;top:0;z-index:5;background:var(--bg);margin:-12px 0 0;padding:12px 0 10px;box-shadow:0 8px 12px -8px rgba(0,0,0,.8)}
  .stage{height:34vh}
  .plates{max-height:34vh}
  .exports{max-height:22vh}
  .vbar .grp{display:contents}
  .vbar{gap:6px;justify-content:flex-start}
  .vbar .tb,.vbar .seg button{min-height:34px}
  #undoBtn{order:1}#redoBtn{order:2}#resetBtn{order:3}
  #holdOrig{order:4;margin-left:auto}
  .vbar .seg{order:5}
  .vbar .stat{order:7;flex-basis:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #busy{order:6;flex-basis:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <main class="viewport">
    <div class="vbar">
      <div class="grp">
        <div class="seg" role="group" aria-label="View">
          <button type="button" id="vComp" aria-pressed="true">Composite</button>
          <button type="button" id="vPlates" aria-pressed="false">Plates</button>
        </div>
        <div class="seg" role="group" aria-label="Zoom">
          <button type="button" data-zoom="fit" aria-pressed="true">Fit</button>
          <button type="button" data-zoom="1" aria-pressed="false">1:1</button>
          <button type="button" data-zoom="2" aria-pressed="false">2×</button>
          <button type="button" data-zoom="4" aria-pressed="false">4×</button>
        </div>
        <button type="button" class="tb" id="holdOrig" aria-pressed="false">Hold for original</button>
      </div>
      <div class="grp">
        <button type="button" class="tb" id="undoBtn" disabled title="Undo (Ctrl+Z)">Undo</button>
        <button type="button" class="tb" id="redoBtn" disabled title="Redo (Ctrl+Shift+Z)">Redo</button>
        <button type="button" class="tb" id="resetBtn" title="Reset every setting">Reset</button>
        <span class="stat busy-label" id="busy" hidden>Rendering…</span>
        <span class="stat" id="stat">—</span>
      </div>
    </div>
    <div class="stage fit" id="stage">
      <canvas id="outCanvas" width="10" height="10" aria-label="Dithered proof"></canvas>
      <canvas id="origCanvas" width="10" height="10" hidden aria-label="Original, resampled"></canvas>
    </div>
    <div class="plates" id="plates" hidden></div>
    <section class="exports" id="exports" hidden aria-label="Saved files">
      <p class="note">Full-size files with hard pixel edges. Right-click (or long-press) a file to save it.</p>
      <div class="grid" id="exportGrid"></div>
    </section>
  </main>

  <aside class="panel" aria-label="Controls">
    <div class="head">
      <div class="brand"><canvas id="mark" width="8" height="8" aria-hidden="true"></canvas><h1>Dither Bench <span>II</span></h1></div>
      <div class="actions">
        <label class="btn">Open image<input type="file" id="fileIn" accept="image/*"></label>
        <button type="button" class="btn primary" id="saveTop">Save PNG</button>
      </div>
      <p class="src" id="srcInfo"></p>
    </div>
    <details class="sec"><summary>Looks<span class="sum" id="sum-looks"></span></summary><div class="body" id="b-looks"></div></details>
    <details class="sec" open><summary>Canvas<span class="sum" id="sum-canvas"></span></summary><div class="body" id="b-canvas"></div></details>
    <details class="sec" open><summary>Engine<span class="sum" id="sum-engine"></span></summary><div class="body" id="b-engine"></div></details>
    <details class="sec" open><summary>Color<span class="sum" id="sum-color"></span></summary><div class="body" id="b-color"></div></details>
    <details class="sec"><summary>Shape the image<span class="sum" id="sum-shape"></span></summary><div class="body" id="b-shape"></div></details>
    <details class="sec"><summary>Print finish<span class="sum" id="sum-finish"></span></summary><div class="body" id="b-finish"></div></details>
    <details class="sec"><summary>Output<span class="sum" id="sum-output"></span></summary><div class="body" id="b-output"></div></details>
    <details class="sec"><summary>My presets<span class="sum" id="sum-presets"></span></summary><div class="body" id="b-presets"></div></details>
  </aside>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(() => {
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const el=(t,c,txt)=>{const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e;};
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const hex2rgb=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const rgb2hex=c=>'#'+c.map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('');
const lumOf=(r,g,b)=>(0.2126*r+0.7152*g+0.0722*b)/255;
const hash=(x,y)=>{let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263))|0;h=Math.imul(h^(h>>>13),1274126177);return ((h^(h>>>16))>>>0)/4294967296;};
const clone=o=>JSON.parse(JSON.stringify(o));
const HEX=/^#[0-9a-f]{6}$/i;

const DEFAULT={
  gridH:420, resample:'smooth', lineKeep:75, printDpi:300, fileScale:'print', transparent:false,
  engine:'dither', algo:'floyd', serp:true, patScale:1, tileSize:8, mPeriod:6, mAmp:50,
  hShape:'round', hSize:6, hAngle:45,
  aMode:'ramp', aSet:'standard', aChars:'.:+*#@', aText:'MEMENTO MORI ', aFont:'JetBrains Mono', aSize:10, aWeight:50, aEdges:0,
  strength:100, cleanup:false,
  mode:'tonal',
  tones:{bg:'#0d0d0b',bgEnd:'dark',inks:[{c:'#e9a53c',p:100}]},
  palette:['#101114','#f2efe6','#e8337f','#2f6fb3','#f2a03a','#3a8f5c'],
  angR:15,angG:75,angB:0,angC:15,angM:75,angY:0,angK:45,kAmt:100,paper:'#f0ead9',
  lvB:0,lvW:255,lvP:0.5,contrast:0,sat:0,sharpAmt:40,sharpRad:1,blur:0,noise:0,edges:0,invert:false,
  fMisreg:0,fOverprint:false,fWear:0,fGrain:0,fCrackle:0,fSeed:7
};
let S=Object.assign(clone(DEFAULT),{view:'comp',zoom:'fit'});

const DIFFUSION=[['floyd','Floyd Steinberg'],['falsefs','False Floyd Steinberg'],['atkinson','Atkinson'],['jjn','Jarvis Judice Ninke'],['stucki','Stucki'],['burkes','Burkes'],['sierra','Sierra'],['sierra2','Two-row Sierra'],['sierralite','Sierra Lite'],['fan','Fan'],['shiaufan','Shiau Fan'],['shiaufan2','Shiau Fan 2'],['stevenson','Stevenson Arce'],['riemersma','Riemersma (Hilbert curve)']];
const ORDERED=[['bayer2','Bayer 2×2'],['bayer4','Bayer 4×4'],['bayer8','Bayer 8×8'],['bayer16','Bayer 16×16'],['cluster4','Clustered dot 4×4'],['cluster8','Clustered dot 8×8'],['blue','Blue noise'],['ign','Gradient noise'],['white','White noise']];
const PATTERN=[['hline','Horizontal lines'],['vline','Vertical lines'],['diag','Diagonal lines'],['xhatch','Diagonal crosshatch'],['weave','Bi-thread weave'],['zigzag','Zigzag'],['brick','Brick'],['custom','Custom tile image…']];

let customTileImg=null,tileMap=null;

    x.fillStyle='#fff';x.fillRect(0,0,N,N);x.imageSmoothingQuality='high';x.drawImage(customTileImg,0,0,N,N);
    const d=x.getImageData(0,0,N,N).data;for(let i=0;i<N*N;i++)vals[i]=lumOf(d[i*4],d[i*4+1],d[i*4+2]);}

const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();

function pullPalette(k){
  const from=orig.width>1?orig:src,c=document.createElement('canvas'),sz=Math.min(1,160/Math.max(from.width,from.height));
  c.width=Math.max(1,Math.round(from.width*sz));c.height=Math.max(1,Math.round(from.height*sz));
  const x=c.getContext('2d');x.imageSmoothingEnabled=false;x.drawImage(from,0,0,c.width,c.height);const d=x.getImageData(0,0,c.width,c.height).data;
  const pts=[];for(let i=0;i<d.length;i+=4)if(d[i+3]>=128)pts.push([d[i],d[i+1],d[i+2]]);
  if(!pts.length)return;
  pts.sort((a,b)=>lumOf(...a)-lumOf(...b));
  let cen=Array.from({length:k},(_,i)=>[...pts[Math.min(pts.length-1,Math.floor((i+0.5)/k*pts.length))]]);
  for(let it=0;it<14;it++){const sum=cen.map(()=>[0,0,0,0]);
    for(const p of pts){let j=0,b=1e18;for(let i=0;i<k;i++){const q=cen[i],e=(p[0]-q[0])**2+(p[1]-q[1])**2+(p[2]-q[2])**2;if(e<b){b=e;j=i;}}const s=sum[j];s[0]+=p[0];s[1]+=p[1];s[2]+=p[2];s[3]++;}
    cen=cen.map((q,i)=>sum[i][3]?[sum[i][0]/sum[i][3],sum[i][1]/sum[i][3],sum[i][2]/sum[i][3]]:q);}
  cen.sort((a,b)=>lumOf(...a)-lumOf(...b));
  S.palette=cen.map(rgb2hex);
}

  aMode:['ramp','text'],aSet:[...Object.keys(ASCII_SETS),'custom'],aFont:FONTS,fileScale:['print','1','2','4','8']};
function applyRecipe(r){
  if(!r||typeof r!=='object')throw new Error('That isn’t a recipe object.');
  for(const k of Object.keys(DEFAULT)){
    if(!(k in r))continue;const v=r[k];
    if(k==='tones'){if(!v||typeof v!=='object')continue;const t=S.tones;if(HEX.test(v.bg))t.bg=v.bg;if(v.bgEnd==='dark'||v.bgEnd==='light')t.bgEnd=v.bgEnd;
      if(Array.isArray(v.inks)){const inks=v.inks.filter(i=>i&&HEX.test(i.c)&&typeof i.p==='number').slice(0,5).map(i=>({c:i.c,p:clamp(Math.round(i.p),0,100)}));if(inks.length)t.inks=inks;}}
    else if(k==='palette'){if(Array.isArray(v)&&v.length>=2&&v.every(c=>HEX.test(c)))S.palette=v.slice(0,24);}
    else if(ENUM[k]){if(ENUM[k].includes(String(v)))S[k]=String(v);}
    else if(k==='paper'){if(HEX.test(v))S.paper=v;}
    else if(typeof v===typeof DEFAULT[k]&&(typeof v!=='number'||Number.isFinite(v)))S[k]=v;
  }
  if(![150,300,600,1200].includes(S.printDpi))S.printDpi=300;
  S.gridH=clamp(Math.round(S.gridH),16,MAXC);S.aSize=clamp(Math.round(S.aSize),5,40);S.hSize=clamp(S.hSize,2,60);S.mPeriod=clamp(S.mPeriod,2,60);
  S.patScale=clamp(Math.round(S.patScale),1,8);S.tileSize=clamp(Math.round(S.tileSize),2,64);S.lvB=clamp(Math.round(S.lvB),0,253);S.lvW=clamp(Math.round(S.lvW),S.lvB+2,255);S.lvP=clamp(S.lvP,0.02,0.98);
}

/* ---------- undo / redo / reset ---------- */
/* "base": the settings of the last Look, reset or preset you loaded. Rows that differ from it get an amber dot.
   Each history snapshot remembers its base, so undoing past a Look also brings back that Look's base. */
let BASE=null,BASENAME='',BASEOF=new Map();
const curSettings=()=>{const {view,zoom,...r}=S;return clone(r);};
const differs=k=>!!BASE&&JSON.stringify(S[k])!==JSON.stringify(BASE[k]);
function markBase(name){BASE=curSettings();BASENAME=name||'Custom';}
function lookName(r){for(const [,items] of LOOKS)for(const [n,lr] of items)if(lr===r)return n;return 'Custom';}
const H={undo:[],redo:[],cur:null,applying:false,t:0};
const snap=()=>JSON.stringify(recipe());
function syncUndoUi(){$('#undoBtn').disabled=!H.undo.length;$('#redoBtn').disabled=!H.redo.length;}
function commitSoon(){if(H.applying)return;clearTimeout(H.t);H.t=setTimeout(commit,400);}
function commit(){clearTimeout(H.t);const s=snap();if(s===H.cur)return;if(H.cur!==null){H.undo.push(H.cur);if(H.undo.length>150)H.undo.shift();}H.redo.length=0;H.cur=s;BASEOF.set(s,[BASE,BASENAME]);syncUndoUi();}
function restore(s){H.applying=true;try{S=Object.assign(clone(DEFAULT),{view:S.view,zoom:S.zoom});applyRecipe(JSON.parse(s));if(BASEOF.has(s))[BASE,BASENAME]=BASEOF.get(s);rebuild();schedule();}finally{H.applying=false;}syncUndoUi();}
function undo(){commit();if(!H.undo.length)return;H.redo.push(H.cur);H.cur=H.undo.pop();restore(H.cur);}
function redo(){commit();if(!H.redo.length)return;H.undo.push(H.cur);H.cur=H.redo.pop();restore(H.cur);}
function resetAll(){commit();S=Object.assign(clone(DEFAULT),{view:S.view,zoom:S.zoom});markBase('Defaults');rebuild();schedule();commit();toast('Settings reset. Undo brings them back.');}
$('#undoBtn').onclick=undo;$('#redoBtn').onclick=redo;$('#resetBtn').onclick=resetAll;
addEventListener('keydown',e=>{
  if(!(e.ctrlKey||e.metaKey))return;const t=e.target;
  if(t&&t.closest&&t.closest('textarea,input[type=text],input[type=number]'))return;
  const k=e.key.toLowerCase();
  if(k==='z'&&!e.shiftKey){e.preventDefault();undo();}
  else if((k==='z'&&e.shiftKey)||k==='y'){e.preventDefault();redo();}
});

  slider(sec.engine,'aEdges','Edges',0,100,1,{when:a,tip:'Draws outlines with | / - \\ where the image has edges.'});
  note(sec.engine,()=>{const g=gridDims(),gw=Math.max(3,Math.round(S.aSize*0.62));return `${Math.ceil(g.w/gw)} × ${Math.ceil(g.h/S.aSize)} characters`;},a);}
slider(sec.engine,'strength','Dither strength',0,100,1,{when:()=>S.engine!=='ascii',tip:'How much error spreads, or how hard the pattern pushes. Lower reads flatter.'});
seg(sec.engine,'cleanup','Stray cells',[[false,'Keep'],[true,'Remove']],{when:indexed,tip:'Removes lone cells surrounded by one other colour.'});

/* ---------- Color ---------- */
seg(sec.color,'mode','',[['tonal','Tonal'],['grade','Grade'],['rgb','RGB'],['cmyk','CMYK']],{big:true});
const tonalBox=box(sec.color,()=>S.mode==='tonal'),gradeBox=box(sec.color,()=>S.mode==='grade'),rgbBox=box(sec.color,()=>S.mode==='rgb'),cmykBox=box(sec.color,()=>S.mode==='cmyk');
{ // tonal
  const lib=el('div','chips scrollbox');TONEMAPS.forEach(t=>lib.appendChild(chip(t.name,[t.t.bg,...t.t.inks.map(i=>i.c)],()=>{S.tones=clone(t.t);rebuild();schedule();})));
  tonalBox.append(el('div','sub','Tone maps'),lib,el('div','sub','Inks, by the tone where each prints solid'));
  const list=el('div');list.id='inks';list.style.cssText='display:flex;flex-direction:column;gap:6px';tonalBox.appendChild(list);
  const bar=el('div','v');const addB=el('button','btn small','Add ink'),evenB=el('button','btn small','Space evenly');addB.type=evenB.type='button';addB.id='addInk';evenB.id='evenInk';
  addB.onclick=()=>{const k=S.tones.inks;if(k.length>=5)return;k.push({c:'#c8572b',p:50});spread();rebuild();schedule();};
  evenB.onclick=()=>{spread();rebuild();schedule();};bar.append(addB,evenB);tonalBox.appendChild(bar);
  const {v}=row(tonalBox,'Background');const bc=el('input');bc.type='color';bc.id='c-tbg';bc.addEventListener('input',()=>{S.tones.bg=bc.value;schedule();});
  const g=el('div','seg');[['dark','Dark end'],['light','Light end']].forEach(([val,txt])=>{const b=el('button','',txt);b.type='button';b.id='c-bgEnd-'+val;b.onclick=()=>{S.tones.bgEnd=val;spread();rebuild();schedule();};g.appendChild(b);});
  v.append(bc,g);ctl.push({r:v,sync(){bc.value=S.tones.bg;[...g.children].forEach((b,i)=>b.setAttribute('aria-pressed',S.tones.bgEnd===(i?'light':'dark')));addB.disabled=S.tones.inks.length>=5;}});
  note(tonalBox,()=>S.tones.bgEnd==='dark'?'Dark end: the background is the darkest tone and inks glow out of it.':'Light end: the background is paper and inks print the shadows.');
}
function spread(){const k=S.tones.inks,n=k.length,dark=S.tones.bgEnd==='dark';k.sort((a,b)=>lumOf(...hex2rgb(a.c))-lumOf(...hex2rgb(b.c)));k.forEach((ink,i)=>ink.p=Math.round((dark?(i+1)/n:i/n)*100));}
function renderInks(){const list=$('#inks');list.innerHTML='';
  S.tones.inks.forEach((ink,i)=>{const r=el('div','ink'),c=el('input'),rg=el('input'),nm=el('input'),x=el('button','x','×');
    c.type='color';c.value=ink.c;c.id='ink-c-'+i;c.setAttribute('aria-label',`Ink ${i+1} colour`);c.addEventListener('input',()=>{ink.c=c.value;schedule();});
    rg.type='range';rg.min=0;rg.max=100;rg.value=ink.p;rg.id='ink-p-'+i;rg.setAttribute('aria-label',`Ink ${i+1} tone position`);
    nm.type='number';nm.min=0;nm.max=100;nm.value=ink.p;nm.id='ink-n-'+i;nm.setAttribute('aria-label',`Ink ${i+1} tone position value`);
    rg.addEventListener('input',()=>{ink.p=Number(rg.value);nm.value=ink.p;schedule();});
    nm.addEventListener('change',()=>{ink.p=clamp(Math.round(Number(nm.value)||0),0,100);rg.value=nm.value=ink.p;schedule();});
    x.type='button';x.setAttribute('aria-label',`Remove ink ${i+1}`);x.disabled=S.tones.inks.length<2;x.onclick=()=>{S.tones.inks.splice(i,1);rebuild();schedule();};
    r.append(c,rg,nm,x);list.appendChild(r);});}
{ // grade
  const {v}=row(gradeBox,'Colors');const s=el('select');s.id='palCount';for(let i=2;i<=24;i++){const o=el('option','',String(i));o.value=i;s.appendChild(o);}
  const pb=el('button','btn small','Pull from image');pb.type='button';pb.id='pullPal';
  s.addEventListener('change',()=>{pullPalette(Number(s.value));renderPalette();refresh();schedule();});pb.onclick=()=>{pullPalette(S.palette.length);renderPalette();schedule();};
  v.append(s,pb);const sw=el('div','swatches');sw.id='palSw';gradeBox.appendChild(sw);
  note(gradeBox,()=>'The first swatch is the background. Each other colour becomes a plate.');
  const lib=el('div','chips scrollbox');PALETTES.forEach(([name,c])=>lib.appendChild(chip(name,c.slice(0,8),()=>{S.palette=[...c];renderPalette();refresh();schedule();})));
  gradeBox.append(el('div','sub','Palette library'),lib);
}
function renderPalette(){const box=$('#palSw');box.innerHTML='';$('#palCount').value=String(S.palette.length);
  S.palette.forEach((hex,i)=>{const c=el('input');c.type='color';c.id='pal-'+i;c.value=hex;c.setAttribute('aria-label',i?`Color ${i}`:'Background');c.title=i?`Color ${i}`:'Background';
    c.addEventListener('input',()=>{S.palette[i]=c.value;schedule();});box.appendChild(c);});}
note(rgbBox,()=>'Red, green and blue are each dithered on or off over black, like a screen. Eight colours in all.');
['R','G','B'].forEach((c,i)=>slider(rgbBox,'ang'+c,['Red','Green','Blue'][i]+' angle',0,180,0.5,{when:canRotate}));
note(cmykBox,()=>'Four process plates, mixed the way ink overlaps on paper.');
color(cmykBox,'paper','Paper');
slider(cmykBox,'kAmt','Black plate',0,100,1,{tip:'How much shared darkness moves onto the black plate.'});
['C','M','Y','K'].forEach((c,i)=>slider(cmykBox,'ang'+c,['Cyan','Magenta','Yellow','Black'][i]+' angle',0,180,0.5,{when:canRotate}));

/* ---------- Shape ---------- */
{const {v,r}=row(sec.shape,'Levels',{},['lvB','lvW','lvP']);r.style.alignItems='start';v.style.display='block';
  v.innerHTML=`<div class="levels"><canvas id="hist" width="256" height="40" aria-label="Luminance histogram"></canvas><div class="ramp" aria-hidden="true"></div>
  <div class="ltrack" id="ltrack"><button type="button" class="lh" id="lhB" aria-label="Black point"></button><button type="button" class="lh mid" id="lhM" aria-label="Midtone"></button><button type="button" class="lh" id="lhW" aria-label="White point"></button></div>
  <div class="lnums"><input type="number" id="lvB" min="0" max="253" step="1" aria-label="Black point value"><input type="number" id="lvG" min="0.1" max="9.99" step="0.01" aria-label="Midtone gamma"><input type="number" id="lvW" min="2" max="255" step="1" aria-label="White point value"></div></div>`;}
slider(sec.shape,'contrast','Contrast',-100,100,1);
slider(sec.shape,'sat','Saturation',-100,100,1,{when:()=>S.mode!=='tonal',tip:'Pale colours need a push to land on bright inks.'});
slider(sec.shape,'sharpAmt','Sharpen',0,300,1);
slider(sec.shape,'sharpRad','Sharpen radius',1,10,1,{when:()=>S.sharpAmt>0});
slider(sec.shape,'blur','Blur',0,20,1);
slider(sec.shape,'noise','Denoise | Grain',-100,100,1,{tip:'Left of zero smooths speckle. Right of zero adds grain before dithering.'});
slider(sec.shape,'edges','Ink outlines',0,100,1,{tip:'Darkens edges so shapes hold together at coarse grids.'});
onoff(sec.shape,'invert','Invert');

/* ---------- Finish ---------- */
note(sec.finish,()=>'Wear and tear added to the composite after dithering. Saved plates stay clean.');
slider(sec.finish,'fMisreg','Misregister',0,8,1,{tip:'Shifts each plate by up to this many cells, like a loose press.'});
onoff(sec.finish,'fOverprint','Overprint',{when:indexed,tip:'Inks multiply where they overlap instead of covering. Meant for light paper.'});
slider(sec.finish,'fWear','Ink wear',0,100,1,{tip:'Patchy ink that lets the background show through.'});
slider(sec.finish,'fGrain','Paper grain',0,100,1);
slider(sec.finish,'fCrackle','Crackle',0,100,1,{tip:'Fine pale creases, like an old folded cover.'});
slider(sec.finish,'fSeed','Variation',1,99,1,{when:()=>S.fMisreg+S.fWear+S.fGrain+S.fCrackle>0,tip:'Reshuffles the wear pattern.'});

/* ---------- Output ---------- */
select(sec.output,'printDpi','Print DPI',[[150,'150'],[300,'300'],[600,'600'],[1200,'1200']],{after:clearExports,tip:'The resolution your image prints at. Sets the physical size.'});
seg(sec.output,'transparent','Background',[[false,'Solid'],[true,'Transparent']],{tip:'Transparent drops the background so the ink sits on whatever you layer it over.'});
select(sec.output,'fileScale','File size',[['print','Print-ready'],['1','1 px per cell'],['2','2 px per cell'],['4','4 px per cell'],['8','8 px per cell']],{after:()=>{clearExports();syncFileHint();},tip:'Print-ready enlarges each cell by a whole number until the file meets your Print DPI.'});
note(sec.output,null,null,'fileHint');
{const b=el('div','savebtns'),a=el('button','btn primary','Save PNG'),z=el('button','btn','Save all plates (.zip)');a.type=z.type='button';a.id='saveBottom';z.id='saveZip';a.onclick=savePng;z.onclick=saveZip;b.append(a,z);sec.output.appendChild(b);}
note(sec.output,null,null,'saveNote');

/* ---------- Presets ---------- */
{const p=sec.presets,sr=el('div','saverow'),nm=el('input'),sb=el('button','btn small','Save');nm.type='text';nm.id='presetName';nm.placeholder='Name this setup';nm.maxLength=40;nm.setAttribute('aria-label','Preset name');sb.type='button';sb.id='presetSave';
  sr.append(nm,sb);const msg=el('p','note','Saved presets live in this browser.');msg.id='presetMsg';const sv=el('div','saved');sv.id='saved';
  const pre=el('pre');pre.id='recipe';const cp=el('button','btn small','Copy recipe');cp.type='button';cp.id='copyRecipe';
  const ta=el('textarea');ta.id='recipeIn';ta.spellcheck=false;ta.placeholder='Paste a recipe here to load it';ta.setAttribute('aria-label','Recipe to load');
  const ld=el('button','btn small','Load recipe');ld.type='button';ld.id='applyRecipe';const rm=el('p','note');rm.id='recipeMsg';rm.hidden=true;
  p.append(sr,msg,sv,el('div','sub','Recipe'),pre,cp,ta,ld,rm);
  const save=()=>{const name=nm.value.trim()||`Preset ${new Date().toLocaleString()}`,list=readSaved();if(list===null){renderSaved();return;}
    list.unshift({name,recipe:recipe()});
    if(writeSaved(list.slice(0,40))){nm.value='';msg.textContent=`Saved "${name}".`;msg.className='note';}else{msg.textContent='Couldn’t save: browser storage is full or blocked.';msg.className='note warn';}
    renderSaved();};
  sb.onclick=save;nm.addEventListener('keydown',e=>{if(e.key==='Enter')save();});
  cp.onclick=()=>{const t=pre.textContent,sel=()=>{const r=document.createRange();r.selectNodeContents(pre);const s=getSelection();s.removeAllRanges();s.addRange(r);cp.textContent='Selected · Ctrl+C';};
    try{navigator.clipboard.writeText(t).then(()=>{cp.textContent='Copied';setTimeout(()=>cp.textContent='Copy recipe',1400);},sel);}catch(e){sel();}};
  ld.onclick=()=>{rm.hidden=false;try{applyRecipe(JSON.parse(ta.value));markBase('Pasted recipe');rebuild();schedule();rm.textContent='Recipe loaded.';rm.className='note';}catch(e){rm.textContent=`Couldn’t read that: ${e.message}`;rm.className='note warn';}};
}
function renderSaved(){
  const box=$('#saved'),list=readSaved(),msg=$('#presetMsg');box.innerHTML='';
  if(list===null){msg.textContent='This browser is blocking storage, so presets can’t be saved here. Copy the recipe instead.';msg.className='note warn';return;}
  extraSums();
  list.forEach((p,i)=>{const r=el('div','item'),b=chip(p.name,null,()=>{try{applyRecipe(p.recipe);markBase(p.name);rebuild();schedule();}catch(e){}}),del=el('button','btn small','Delete');
    del.type='button';del.setAttribute('aria-label',`Delete preset ${p.name}`);del.onclick=()=>{const l=readSaved()||[];l.splice(i,1);writeSaved(l);renderSaved();};r.append(b,del);box.appendChild(r);});
}

/* ---------- levels widget ---------- */
const lt=$('#ltrack');
function syncLevels(){
  const B=S.lvB,W=S.lvW,mid=B+S.lvP*(W-B);
  $('#lhB').style.left=(B/255*100)+'%';$('#lhW').style.left=(W/255*100)+'%';$('#lhM').style.left=(mid/255*100)+'%';
  $('#lvB').value=B;$('#lvW').value=W;$('#lvG').value=(Math.log(S.lvP)/Math.log(0.5)).toFixed(2);
}
function setLevel(which,v){
  if(which==='B')S.lvB=clamp(Math.round(v),0,S.lvW-2);
  else if(which==='W')S.lvW=clamp(Math.round(v),S.lvB+2,255);
  else S.lvP=clamp((v-S.lvB)/(S.lvW-S.lvB),0.02,0.98);
  syncLevels();schedule();
}
[['#lhB','B'],['#lhM','M'],['#lhW','W']].forEach(([sel,which])=>{
  const h=$(sel);
  h.addEventListener('pointerdown',e=>{e.preventDefault();h.setPointerCapture(e.pointerId);
    const move=ev=>{const r=lt.getBoundingClientRect();setLevel(which,clamp((ev.clientX-r.left)/r.width*255,0,255));};
    const up=()=>{h.removeEventListener('pointermove',move);h.removeEventListener('pointerup',up);h.removeEventListener('pointercancel',up);};
    h.addEventListener('pointermove',move);h.addEventListener('pointerup',up);h.addEventListener('pointercancel',up);});
  h.addEventListener('keydown',e=>{const st=e.shiftKey?10:1;let d=0;
    if(e.key==='ArrowLeft'||e.key==='ArrowDown')d=-st;if(e.key==='ArrowRight'||e.key==='ArrowUp')d=st;if(!d)return;e.preventDefault();
    const cur=which==='B'?S.lvB:which==='W'?S.lvW:S.lvB+S.lvP*(S.lvW-S.lvB);setLevel(which,cur+d);});
});
$('#lvB').addEventListener('change',e=>setLevel('B',Number(e.target.value)||0));
$('#lvW').addEventListener('change',e=>setLevel('W',Number(e.target.value)||255));
$('#lvG').addEventListener('change',e=>{const g=clamp(Number(e.target.value)||1,0.1,9.99);S.lvP=clamp(Math.pow(0.5,g),0.02,0.98);syncLevels();schedule();});

/* ---------- viewport bindings ---------- */
$('#fileIn').addEventListener('change',e=>loadFile(e.target.files[0],false));
{const hd=$('.head'),pn=$('.panel'),setH=()=>pn.style.setProperty('--headH',hd.offsetHeight+'px');setH();if(window.ResizeObserver)new ResizeObserver(setH).observe(hd);}
$('#saveTop').onclick=savePng;
$('#vComp').onclick=()=>{S.view='comp';$('#vComp').setAttribute('aria-pressed',true);$('#vPlates').setAttribute('aria-pressed',false);$('#stage').hidden=false;$('#plates').hidden=true;updateStat();};
$('#vPlates').onclick=()=>{S.view='plates';$('#vPlates').setAttribute('aria-pressed',true);$('#vComp').setAttribute('aria-pressed',false);$('#stage').hidden=true;$('#plates').hidden=false;renderPlates();updateStat();};
$$('[data-zoom]').forEach(b=>b.onclick=()=>{S.zoom=b.dataset.zoom;$$('[data-zoom]').forEach(o=>o.setAttribute('aria-pressed',o===b));applyZoom();});
addEventListener('resize',()=>updateStat());
const hold=$('#holdOrig'),showO=v=>{orig.hidden=!v;out.hidden=v;hold.setAttribute('aria-pressed',v);};
hold.addEventListener('pointerdown',e=>{if(e.button===0)showO(true);});['pointerup','pointerleave','pointercancel','blur','contextmenu'].forEach(ev=>hold.addEventListener(ev,()=>showO(false)));
hold.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();showO(true);}});hold.addEventListener('keyup',()=>showO(false));
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();const f=e.dataTransfer&&e.dataTransfer.files[0];if(f)loadFile(f,false);});
addEventListener('paste',e=>{if(e.target.closest&&e.target.closest('textarea,input'))return;const it=[...(e.clipboardData?.items||[])].find(i=>i.type.startsWith('image/'));if(it)loadFile(it.getAsFile(),false);});

/* mark: a dithered gradient square, drawn with the 4×4 Bayer map */
(function(){const c=$('#mark'),x=c.getContext('2d'),m=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
  x.fillStyle='#dba63f';for(let y=0;y<8;y++)for(let i=0;i<8;i++)if((m[(y%4)*4+(i%4)]+0.5)/16<(i+y+1)/15)x.fillRect(i,y,1,1);})();

drawSample();buildTile();renderSaved();updateSaveUi();
applyLook(LOOKS[0][1][0][1]);
H.cur=snap();H.undo.length=0;BASEOF.set(H.cur,[BASE,BASENAME]);syncUndoUi();
})();
</script>
